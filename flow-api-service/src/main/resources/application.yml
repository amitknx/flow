server:
  port: 8080

spring:
  application:
    name: flow-api-service
  profiles:
    active: test
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/flowboard
    username: flowboard_user
    password: flowboard_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
app:
  security:
    encryption:
      key: 051TYpB0aDOkFWwwDhWQU8rXKagwj92dZtK8IzwuFWQ=
